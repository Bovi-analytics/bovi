name: Docs

# Builds the pdoc site and deploys it to GitHub Pages
# (https://bovi-analytics.github.io/bovi/lactationcurve.html).
# Runs after every release (called by release.yml) or manually.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the docs show the version, which comes from git tags
      - uses: astral-sh/setup-uv@v6
      - name: Build documentation
        run: >
          uv run --with pdoc pdoc lactationcurve
          --output-dir site
          --docformat google
          --logo https://raw.githubusercontent.com/Bovi-analytics/bovi/main/docs/logo.png
          --logo-link https://bovi-analytics.org
          --footer-text "Lactation Curve Package – Bovi-Analytics lab"
          --template-directory docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
