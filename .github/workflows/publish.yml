name: Publish (lactationcurve)

on:
  workflow_run:
    workflows: ["Version Bump"]
    types:
      - completed

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: main

    steps:
      - name: Check for a lactationcurve distribution
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "lactationcurve-dist" and .expired == false)] | length')"
          if [[ "$count" == "1" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No lactationcurve release artifact was produced; skipping PyPI publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download versioned distributions
        if: steps.artifact.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: lactationcurve-dist
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Install uv
        if: steps.artifact.outputs.publish == 'true'
        uses: astral-sh/setup-uv@v8.1.0

      - name: Publish to PyPI
        if: steps.artifact.outputs.publish == 'true'
        run: uv publish dist/*
