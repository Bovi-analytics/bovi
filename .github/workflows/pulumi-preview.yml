name: Pulumi Preview

# TODO: Enable once Azure OIDC credentials are configured
# on:
#   pull_request:
#     branches:
#       - dev
#       - main
#     paths:
#       - "apps/infrastructure/**"
#       - "packages/infrastructure/**"
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  PYTHON_VERSION: "3.12"
  INFRA_DIR: apps/infrastructure

jobs:
  resolve-deployment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      pulumi-stack: ${{ steps.resolve.outputs.pulumi-stack }}
    steps:
      - id: resolve
        shell: bash
        env:
          DISPATCH_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || '' }}
        run: |
          set -euo pipefail
          environment="${DISPATCH_ENVIRONMENT}"
          if [[ -z "$environment" ]]; then
            case "$GITHUB_BASE_REF" in
              main) environment="prod" ;;
              dev) environment="dev" ;;
              *) environment="dev" ;;
            esac
          fi

          {
            echo "environment=${environment}"
            echo "pulumi-stack=${environment}"
          } >> "$GITHUB_OUTPUT"

  preview:
    needs: resolve-deployment
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-deployment.outputs.environment }}
    env:
      PULUMI_STACK: ${{ needs.resolve-deployment.outputs.pulumi-stack }}
    steps:
      - uses: actions/checkout@v4

      - uses: Bovi-analytics/github-actions/.github/actions/setup-python-uv@v1
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: Bovi-analytics/github-actions/.github/actions/azure-login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: Bovi-analytics/github-actions/.github/actions/install-uv-project@v1
        with:
          work-dir: ${{ env.INFRA_DIR }}

      - name: Pulumi Preview
        uses: Bovi-analytics/github-actions/.github/actions/pulumi-command@v1
        with:
          command: preview
          stack-name: ${{ env.PULUMI_STACK }}
          work-dir: ${{ env.INFRA_DIR }}
          cloud-url: azblob://pulumi-state
          comment-on-pr: "true"
          pulumi-config-passphrase: ${{ secrets.PULUMI_PASSPHRASE }}
          azure-storage-account-state: ${{ secrets.AZURE_STORAGE_ACCOUNT_STATE }}
          azure-storage-key: ${{ secrets.AZURE_STORAGE_KEY }}
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          STORAGE_ACCOUNT_NAME_ICAR: ${{ secrets.STORAGE_ACCOUNT_NAME_ICAR }}
          STORAGE_ACCOUNT_KEY_ICAR: ${{ secrets.STORAGE_ACCOUNT_KEY_ICAR }}
          STORAGE_ACCOUNT_CONTAINER_ICAR: ${{ secrets.STORAGE_ACCOUNT_CONTAINER_ICAR }}
