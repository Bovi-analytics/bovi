[project]
name = "bestpred-py"
version = "0.1.0"
description = "Python port of the BESTPRED lactation best-prediction model."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "LicenseRef-US-Government-Public-Domain"
license-files = ["LICENSE"]
dependencies = [
    "f90nml>=1.5.0",
    "numpy>=2.0.0",
    "pandas>=2.3.3",
    "pydantic>=2.8.0",
    "scipy>=1.14.0",
]

[project.scripts]
bestpred = "bestpred.cli:main"
bestpred-py = "bestpred.cli:main"

[dependency-groups]
dev = [
    "basedpyright==1.39.3",
    "pytest>=8.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bestpred"]
artifacts = [
    "src/bestpred/data/adjust.scs",
    "src/bestpred/data/aiplage.h",
    "src/bestpred/data/bestpred.f90",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
pythonPlatform = "All"
venvPath = "../../.."
venv = ".venv"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportMissingTypeStubs = "none"
reportMissingParameterType = "none"
reportUnknownParameterType = "none"
exclude = [
    ".venv",
    "**/__pycache__",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "golden: tests that compare against current Fortran oracle fixtures",
    "legacy: tests that document drift versus legacy manual output",
    "source11: source 11 simulation and parsing tests",
]
