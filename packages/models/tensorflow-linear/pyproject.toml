[project]
name = "tensorflow-linear"
version = "0.1.0"
authors = [{ name = "Douwe de Kok", email = "douwedekok@gmail.com" }]
description = "Tiny CPU tensorflow training example for Bovi Core"
requires-python = ">=3.12,<3.13"
dependencies = ["bovi-core", "numpy>=2.4.0", "tensorflow>=2.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tensorflow_linear"]

[project.entry-points."bovi.model_providers"]
tensorflow_linear = "tensorflow_linear.models.provider:TensorFlowLinearModelProvider"
