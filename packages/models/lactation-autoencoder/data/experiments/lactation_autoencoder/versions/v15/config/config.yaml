# Lactation Autoencoder Configuration
experiment_name: lactation_autoencoder
experiment_version: 15
project: lactation autoencoder
description: "Autoencoder for milk production time-series with hierarchical herd statistics"
verbose: 1

# --------------------------------------------------------------------------
# Path Templates: Define reusable path "blueprints" for the project.
# --------------------------------------------------------------------------
path_templates:
  local_weights:
    template: "data/experiments/lactation_autoencoder/versions/v{experiment_version}/weights/{weights_file}"
    uses: weights_file

# Model settings
models:
  autoencoder:
    type: keras_autoencoder
    framework: tensorflow
    template_vars:
      weights_file:
        default: "autoencoder"
    default_weights_location: local

    architecture:
      input_dim: 304
      latent_dim: 64
      num_events: 15
      num_herd_stats: 10

    # Dataset settings
    dataset:
      max_days: 304  # Maximum sequence length in days
      keep_in_memory: true  # Cache JSON data in memory

    # Data pipeline
    dataloaders:
      train:
        # Data source
        source:
          type: lactation_json
          json_root_dir: "data/experiments/lactation_autoencoder/input/train/json/"
          file_pattern: "*.json"

        # Transform pipeline (order matters!)
        transforms:
          # 1. Fill missing milk values (forward fill)
          - name: imputation
            params:
              method: forward_fill
              fields: ["milk"]

          # 2. Convert event strings to integers
          - name: event_tokenization

          # 3. Normalize milk to 0-1 range
          - name: milk_normalization
            params:
              max_milk: 80.0

        # Loader settings
        dataloader:
          batch_size: 32
          shuffle: true

      validation:
        source:
          type: lactation_json
          json_root_dir: "data/experiments/lactation_autoencoder/input/val/json/"

        transforms:
          - name: imputation
            params:
              method: forward_fill
          - name: event_tokenization
          - name: milk_normalization
            params:
              max_milk: 80.0

        dataloader:
          batch_size: 32
          shuffle: false

      inference:
        source:
          type: lactation_json
          json_root_dir: "data/experiments/lactation_autoencoder/input/inference/json/"
          file_pattern: "*.json"

        transforms:
          - name: imputation
            params:
              method: forward_fill
              fields: ["milk"]
          - name: event_tokenization
          - name: milk_normalization
            params:
              max_milk: 80.0

        dataloader:
          batch_size: 1
          shuffle: false

    # Training settings (for reference)
    training:
      epochs: 50
      early_stopping_patience: 10
      learning_rate: 0.001
      loss: "mse"
      optimizer: "adam"

# Unity Catalog (for future)
unity_catalog:
  catalog: "projects"
  schema: "bovi_core"
  model_name: "lactation_autoencoder"

herd_stats_ranges:
  Achieved21Milk:          [0.0, 50.0]
  Achieved305Milk:         [3000.0, 15000.0]
  Achieved75Milk:          [0.0, 50.0]
  AchievedMilk:            [3000.0, 20000.0]
  DaysDry:                 [0.0, 150.0]
  DaysInMilk:              [0.0, 600.0]
  DaysOpen:                [0.0, 300.0]
  DaysPregnant:            [0.0, 283.0]
  HistoricCalvingInterval: [300.0, 600.0]
  QualitySequence:         [0.0, 1.0]
