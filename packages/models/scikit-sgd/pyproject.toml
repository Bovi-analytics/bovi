[project]
name = "scikit-sgd"
version = "0.1.0"
description = "Minimal scikit-learn training example for Bovi Core"
authors = [{ name = "Douwe de Kok", email = "douwedekok@gmail.com" }]
requires-python = ">= 3.12, < 3.13"
dependencies = [
    "bovi-core",
    "joblib>=1.4.0",
    "numpy>=2.4.0",
    "scikit-learn>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scikit_sgd"]

[project.entry-points."bovi.model_providers"]
scikit_sgd = "scikit_sgd.models.provider:ScikitSGDModelProvider"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
